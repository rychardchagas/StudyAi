<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4A3C30" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="300" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="300" fill="#1A1310"/>
  <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridMask)" opacity="0.55"/>

  <!-- Mark (stacked flashcards) -->
  <g transform="translate(80,58) scale(1.35)">
    <rect width="100" height="100" rx="24" fill="#1A1310"/>
    <rect x="22" y="24" width="52" height="34" rx="7" fill="#6E5B49"/>
    <rect x="26" y="34" width="52" height="34" rx="7" fill="#B98A22"/>
    <rect x="30" y="44" width="52" height="34" rx="7" fill="#F1E7D6"/>
    <rect x="38" y="55" width="22" height="4" rx="2" fill="#1A1310"/>
    <rect x="38" y="64" width="13" height="4" rx="2" fill="#2F9C8D"/>
  </g>

  <!-- Wordmark -->
  <text x="252" y="152" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="66" font-weight="700" fill="#F1E7D6">StudyAI</text>
  <rect x="253" y="172" width="430" height="2" fill="#B98A22" opacity="0.75"/>
  <text x="252" y="203" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#8A7F72">CALEND&#193;RIO DE ESTUDOS INTELIGENTE</text>
</svg>
